<!doctype html><meta charset="utf-8"><title>响应式验收</title><style>body{font:18px system-ui}button{font:inherit;padding:12px}iframe{display:block;width:1000px;height:800px;border:1px solid #ccc}pre{white-space:pre-wrap}</style><button id="run">运行尺寸测试</button><pre id="results"></pre><iframe src="/tests/fixture.html"></iframe>
<script>
document.querySelector('#run').onclick=async()=>{const f=document.querySelector('iframe'),out=document.querySelector('#results'),w=f.contentWindow,d=f.contentDocument,r=d.querySelector('#quiet-manga-host').shadowRoot,q=s=>r.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));let pass=0,fail=0;out.textContent='RUNNING\n';const pos=()=>{const s=q('#stage'),els=[...s.querySelectorAll('.sheet')],e=els.find(e=>e.offsetTop+e.offsetHeight>s.scrollTop+1);return{page:e.dataset.page,offset:(s.scrollTop-e.offsetTop)/e.offsetHeight}};const check=(a,b)=>{if(a.page!==b.page||Math.abs(a.offset-b.offset)>.003)throw Error(JSON.stringify([a,b]));};
q('#launch').click();await wait(300);q('#flow').click();await wait(300);q('#stage').scrollTop=1500;await wait(300);
for(const width of [600,360,320,1000,1440]){try{const a=pos();f.style.width=width+'px';await wait(250);const b=pos();check(a,b);const top=q('#top'),groups=['#chapters','#pager','#tools'].map(id=>q(id).getBoundingClientRect());if(top.scrollWidth>w.innerWidth||groups.some(b=>b.left<0||b.right>w.innerWidth||b.bottom>top.getBoundingClientRect().bottom))throw Error('工具栏溢出');for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){const a=groups[i],b=groups[j];if(Math.min(a.right,b.right)>Math.max(a.left,b.left)+1&&Math.min(a.bottom,b.bottom)>Math.max(a.top,b.top)+1)throw Error('顶栏分组重叠');}if(width===1440){const pager=q('#pager').getBoundingClientRect();if(Math.abs((pager.left+pager.right)/2-w.innerWidth/2)>1)throw Error('页码不居中');}out.textContent+='PASS '+width+' px 宽度与位置\n';pass++;}catch(e){fail++;out.textContent+='FAIL '+width+' px '+e.message+'\n';}}
try{q('#fit').click();await wait(150);f.style.width='360px';f.style.height='640px';await wait(200);const i=q('#single img'),s=q('#stage');if(i.clientWidth>s.clientWidth||i.clientHeight>s.clientHeight)throw Error('整页溢出');q('#options').click();const b=q('#settings').getBoundingClientRect();if(b.left<0||b.right>w.innerWidth||b.bottom>w.innerHeight)throw Error('设置溢出');pass++;out.textContent+='PASS 360×640 整页和设置\n';}catch(e){fail++;out.textContent+='FAIL '+e.message+'\n';}
try{const toc=q('#toc');toc.showModal();await wait(60);const b=toc.getBoundingClientRect();if(b.left<0||b.right>w.innerWidth||b.top<0||b.bottom>w.innerHeight)throw Error('目录浮层溢出');toc.close();pass++;out.textContent+='PASS 360×640 目录浮层\n';}catch(e){fail++;out.textContent+='FAIL '+e.message+'\n';}
q('#exit').click();out.textContent+=`${pass} PASS / ${fail} FAIL`;document.title=out.textContent.split('\n').at(-1);};
</script>
