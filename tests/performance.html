<!doctype html><meta charset="utf-8"><title>Chrome 性能采样</title><style>body{font:18px system-ui}button{font:inherit;padding:12px}iframe{display:block;width:1000px;height:800px}</style><button id="run">运行性能采样</button><pre id="results"></pre><iframe src="/tests/fixture.html"></iframe><script>
document.querySelector('#run').onclick=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,r=f.contentDocument.querySelector('#quiet-manga-host').shadowRoot,q=s=>r.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms)),out=document.querySelector('#results');out.textContent='RUNNING';q('#launch').click();await wait(400);q('#flow').click();await wait(400);const samples=[];let prev;await new Promise(resolve=>{function tick(t){if(prev)samples.push(t-prev);prev=t;q('#stage').scrollTop+=6;if(samples.length<120)w.requestAnimationFrame(tick);else resolve();}w.requestAnimationFrame(tick)});samples.sort((a,b)=>a-b);const result={frames:samples.length,medianMs:samples[60],p95Ms:samples[114],maxMs:samples[119],imageNodes:q('#stage').querySelectorAll('img').length};out.textContent=JSON.stringify(result,null,2);q('#exit').click();document.title='性能采样完成';};
</script>
