<!doctype html><meta charset="utf-8"><title>Chrome 性能采样</title><style>body{font:18px system-ui}button{font:inherit;padding:12px}iframe{display:block;width:1000px;height:800px}</style><button id="run">运行性能采样</button><pre id="results"></pre><iframe></iframe><script>
document.querySelector("iframe").src = location.search === "?double" ? "/tests/spread-sample.html?long" : "/tests/fixture.html";
document.querySelector('#run').onclick=async()=>{const f=document.querySelector('iframe'),w=f.contentWindow,r=f.contentDocument.querySelector('#quiet-manga-host').shadowRoot,q=s=>r.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms)),out=document.querySelector('#results');out.textContent='RUNNING';q('#launch').click();await wait(400);q('#flow').click();if(location.search==='?double')q('#twoUp').click();await wait(400);const sample=async step=>{const samples=[];let prev;await new Promise(resolve=>{function tick(t){if(prev)samples.push(t-prev);prev=t;step(samples.length);if(samples.length<120)w.requestAnimationFrame(tick);else resolve();}w.requestAnimationFrame(tick)});samples.sort((a,b)=>a-b);return{frames:samples.length,medianMs:samples[60],p95Ms:samples[114],maxMs:samples[119]};};
const scroll=await sample(()=>{q('#stage').scrollTop+=location.search==='?double'?28:6;});q('#width').value=700;q('#width').dispatchEvent(new Event('input'));const gesture=await sample(n=>{const b=q('#stage').getBoundingClientRect();for(let i=0;i<8;i++)q('#stage').dispatchEvent(new w.WheelEvent('wheel',{deltaY:n%20<10?-1:1,ctrlKey:true,clientX:b.left+b.width/2,clientY:b.top+b.height/2,cancelable:true,bubbles:true}));});const result={paired:q('#strip').dataset.paired,scroll,gesture,imageNodes:q('#stage').querySelectorAll('img').length,cache: Number(f.contentDocument.querySelector('#quiet-manga-host').dataset.cached)};out.textContent=JSON.stringify(result,null,2);q('#exit').click();document.title='性能采样完成';};
</script>
