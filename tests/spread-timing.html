<!doctype html><meta charset="utf-8"><title>双页翻动采样</title><button>运行翻组采样</button><pre></pre><iframe src="/tests/spread-sample.html" style="display:block;width:1080px;height:700px;border:0"></iframe><script>
const f=document.querySelector('iframe'),out=document.querySelector('pre');
document.querySelector('button').onclick=async()=>{
 try{
 const w=f.contentWindow,h=f.contentDocument.querySelector('#quiet-manga-host'),q=s=>h.shadowRoot.querySelector(s);
 const frame=()=>new Promise(r=>w.requestAnimationFrame(r));
 const opening=async n=>{for(let i=0;i<180;i++){if(q('#pageRange').textContent===n&&q('.spreadFrame'))return;await frame();}throw Error('等待页组 '+n);};
 q('#launch').click();while(!q('#single img'))await frame();q('#twoUp').click();await opening('1–2');
 q('#next').click();await opening('3–4');q('#prev').click();await opening('1–2');
 const samples=[];
 for(let n=0;n<40;n++){await frame();const start=w.performance.now(),forward=n%2===0;q(forward?'#next':'#prev').click();await opening(forward?'3–4':'1–2');samples.push(w.performance.now()-start);}
 samples.sort((a,b)=>a-b);const round=n=>Math.round(n*10)/10;
 out.textContent=JSON.stringify({samples:40,medianMs:round(samples[19]),p95Ms:round(samples[37]),images:q('#stage').querySelectorAll('img').length});document.title='翻组采样完成';
 }catch(e){out.textContent='ERROR '+e.message;}
};
</script>
